<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Hyperscape SPZ Viewer</title>
    <link rel="stylesheet" href="viewer.css">
</head>
<body class="layout">
<header class="file-panel">
    <h1>Hyperscape SPZ Viewer</h1>
    <a class="header-link" href="quest.html">Quest viewer</a>
    <div class="actions">
        <button id="open" class="primary">Open SPZ</button>
        <button id="reset">Reset view</button>
    </div>
    <input id="file" type="file" accept=".spz" hidden>
    <p id="status" role="status">Files stay on this device.</p>
</header>
<main id="viewport" aria-label="Scan view">
    <canvas id="view" tabindex="0" aria-label="3D scene. Drag to look and use WASD to move."></canvas>
    <div id="empty">Drop an SPZ file here.</div>
    <p id="stats" hidden></p>
</main>
<aside class="settings-panel" aria-label="Viewer settings">
    <section aria-labelledby="render-heading">
        <h2 id="render-heading">Rendering</h2>
        <p class="hint range-note">RayQuadratic kernel · <a href="https://github.com/adc103/hyperscape-spz-tools/blob/main/docs/rendering.md">Rendering reference</a></p>
        <label class="setting"><span>Mip-Splatting<span class="hint">Reduces shimmer on fine detail.</span></span><input id="mip" type="checkbox" checked></label>
        <label class="setting"><span>Distance-based detail<span class="hint">Draws fewer splats farther away.</span></span><input id="lod" type="checkbox" checked></label>
        <label class="setting"><span>Foveated SH color<span class="hint">Simplifies view-dependent color at the edges.</span></span><input id="sh" type="checkbox"></label>
        <label class="setting"><span>8-bit SH quantization<span class="hint">Rounds view-dependent color coefficients.</span></span><input id="quant" type="checkbox"></label>
    </section>
    <section aria-labelledby="camera-heading">
        <h2 id="camera-heading">Camera</h2>
        <label class="setting"><span>Side-by-side stereo</span><input id="stereo" type="checkbox"></label>
        <p class="hint">Drag to look. WASD to move, Q/E for height.</p>
    </section>
    <details>
        <summary>Advanced rendering</summary>
        <label class="select-row"><span>Depth sort</span><select id="sort"><option value="32">32-bit</option><option value="16">16-bit</option></select></label>
        <label class="select-row"><span>Convert color to linear</span><select id="color"><option value="0">Off</option><option value="1">Per splat</option><option value="2">Composite</option></select></label>
        <label class="setting"><span>Adaptive GPU budget</span><input id="adaptive" type="checkbox"></label>
        <label class="setting"><span>Two-resolution rendering</span><input id="foveation" type="checkbox"></label>
        <label class="select-row"><span>Frame reuse</span><select id="reuse"><option value="0">Off</option><option value="1">Low-resolution layer</option><option value="2">High-resolution layer</option></select></label>
        <div class="actions">
            <button id="openFrame">Load frame JSON</button>
            <button id="clearFrame" hidden>Clear</button>
        </div>
        <input id="frameFile" type="file" accept=".json" hidden>
        <p id="frameStatus" role="status"></p>
        <p class="hint"><a href="https://github.com/adc103/hyperscape-spz-tools/blob/main/docs/viewers.md#frame-json">Frame JSON format</a></p>
    </details>
</aside>
<script src="format.js"></script>
<script src="shaders.js"></script>
<script src="render.js"></script>
<script src="frame.js"></script>
<script src="app.js"></script>
</body>
</html>
